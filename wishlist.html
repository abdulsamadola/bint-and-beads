<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Saved Wishlist | BINT &amp; BEADS</title>
  <meta name="description" content="Review your saved handcrafted beaded jewelry, waist beads, and accessories from Bint & Beads.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/images/emblem.svg">
  
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Top Announcement Bar -->
  <aside id="bint-announcement-bar"></aside>

  <!-- Global Header -->
  <header id="bint-header"></header>

  <main id="main-content">
    <div class="container section-padding-sm">
      <!-- Breadcrumbs -->
      <nav class="breadcrumbs" aria-label="Breadcrumbs">
        <a href="index.html">Home</a>
        <span class="breadcrumbs-separator">/</span>
        <span class="breadcrumbs-current">Wishlist</span>
      </nav>

      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; flex-wrap: wrap; gap: 16px;">
        <div>
          <span class="text-meta" style="color: var(--color-gold);">PERSONAL VAULT</span>
          <h1 style="font-size: clamp(2.2rem, 3.5vw, 3rem); font-family: var(--font-serif); margin-top: 4px;">SAVED PIECES</h1>
        </div>
        <div id="wishlist-count-display" style="font-size: 0.875rem; color: var(--color-grey-dark); font-weight: 500;">
          0 Pieces Saved
        </div>
      </div>

      <!-- Empty State -->
      <div id="wishlist-empty-state" class="empty-state" style="display: none; padding: 60px 20px;">
        <div class="empty-state-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </div>
        <h2 class="empty-state-title">Your wishlist is waiting for something beautiful</h2>
        <p class="empty-state-desc">Save your favourite handcrafted necklaces, bracelets, and custom inspirations to view them anytime.</p>
        <a href="shop.html" class="btn btn-primary">Explore The Collection</a>
      </div>

      <!-- Wishlist Product Grid -->
      <div class="product-grid" id="wishlist-grid" style="padding-bottom: 80px;">
        <!-- Injected by wishlist.js -->
      </div>
    </div>
  </main>

  <!-- Global Footer -->
  <footer id="bint-footer"></footer>

  <!-- Universal Scripts -->
  <script src="js/bint-core.js"></script>
  <script src="js/wishlist.js"></script>
</body>
</html>
