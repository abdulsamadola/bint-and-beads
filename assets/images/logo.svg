<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3D1A5" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8C6527" />
    </linearGradient>
  </defs>

  <!-- Left Monogram Icon -->
  <g transform="translate(4, 4) scale(0.56)">
    <!-- Outer beaded ring -->
    <circle cx="50" cy="50" r="44" stroke="url(#logoGold)" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="39" stroke="url(#logoGold)" stroke-width="1" opacity="0.5"/>
    <circle cx="50" cy="6" r="3.5" fill="url(#logoGold)"/>
    <circle cx="94" cy="50" r="3.5" fill="url(#logoGold)"/>
    <circle cx="50" cy="94" r="3.5" fill="url(#logoGold)"/>
    <circle cx="6" cy="50" r="3.5" fill="url(#logoGold)"/>
    
    <!-- Monogram letters -->
    <text x="22" y="62" font-family="'Cormorant Garamond', Georgia, serif" font-size="40" font-weight="400" fill="url(#logoGold)">B</text>
    <text x="44" y="64" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-style="italic" font-weight="300" fill="#080808" stroke="url(#logoGold)" stroke-width="1">B</text>
    <circle cx="48" cy="48" r="2.5" fill="url(#logoGold)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(74, 34)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="400" letter-spacing="4" fill="#080808">BINT <tspan fill="url(#logoGold)" font-style="italic" font-weight="300">&amp;</tspan> BEADS</text>
    <text x="2" y="15" font-family="'Manrope', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="3.5" fill="#77736D">LAGOS &bull; HANDCRAFTED LUXURY</text>
  </g>
</svg>
